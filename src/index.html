<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>快擎浏览器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="browser-chrome">
        <div class="tabs-row">
          <div class="brand" aria-label="快擎浏览器">
            <span class="brand-mark">Q</span>
            <span class="brand-name">快擎</span>
          </div>
          <div id="tabStrip" class="tab-strip" role="tablist" aria-label="标签页"></div>
          <button id="newTabButton" class="icon-button" type="button" title="新建标签页" aria-label="新建标签页">
            +
          </button>
        </div>

        <form id="addressForm" class="nav-row">
          <button id="backButton" class="icon-button" type="button" title="后退" aria-label="后退">
            ←
          </button>
          <button id="forwardButton" class="icon-button" type="button" title="前进" aria-label="前进">
            →
          </button>
          <button id="reloadButton" class="icon-button" type="button" title="刷新" aria-label="刷新">
            ↻
          </button>
          <button id="homeButton" class="icon-button" type="button" title="主页" aria-label="主页">
            ⌂
          </button>
          <label class="address-box" for="addressInput">
            <span id="securityIndicator" class="security-indicator">站点</span>
            <input
              id="addressInput"
              autocomplete="off"
              spellcheck="false"
              type="text"
              aria-label="地址栏"
              placeholder="输入网址或搜索"
            />
          </label>
          <button id="goButton" class="go-button" type="submit">前往</button>
        </form>
      </header>

      <main id="browserStack" class="browser-stack" aria-label="网页内容"></main>
      <div id="statusText" class="status-text" aria-live="polite"></div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
